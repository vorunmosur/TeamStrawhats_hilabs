[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termmap"
version = "1.0.0"
description = "Offline biomedical term mapping with hybrid retrieval and context ranking"
requires-python = ">=3.11"

[project.scripts]
termmap = "genlink.retrieval_cli:main"
genlink = "genlink.retrieval_cli:main"

[tool.setuptools.packages.find]
include = ["genlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
